packages:
  - apps/*
  - packages/*

allowBuilds:
  '@trycua/cua-driver': true
  electron: true
  electron-winstaller: false
  esbuild: true

minimumReleaseAgeExclude:
  - electron@43.5.0

# Security patches within the affected release lines. Keep transitive build/test
# dependencies patched even when their upstream lockfiles or ranges lag behind.
overrides:
  'zod@>=4.0.0 <4.6.6': 4.6.6
  'vite@>=7.0.0 <7.3.7': 7.3.7
  '@xmldom/xmldom@>=0.8.0 <0.8.15': 0.8.15
  'fast-uri@>=3.0.0 <3.1.8': 3.1.8
  'js-yaml@>=4.0.0 <4.3.2': 4.3.2
  'undici@>=6.0.0 <6.28.1': 6.28.1
  'undici@>=7.0.0 <7.29.1': 7.29.1
  'brace-expansion@>=1.0.0 <1.1.21': 1.1.21
  'brace-expansion@>=2.0.0 <2.1.7': 2.1.7
  'brace-expansion@>=5.0.0 <5.0.12': 5.0.12
  'http-cache-semantics@>=4.0.0 <4.3.0': 4.3.0
  'source-map-js@>=1.0.0 <1.2.2': 1.2.2

supportedArchitectures:
  os:
    - current
    - darwin
  cpu:
    - current
    - arm64
    - x64

patchedDependencies:
  '@ubjs/node@0.31.0-3': patches/@ubjs__node@0.31.0-3.patch
