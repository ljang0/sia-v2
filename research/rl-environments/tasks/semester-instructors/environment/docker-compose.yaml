services:
  main:
    depends_on:
      portal:
        condition: service_healthy

  portal:
    build:
      context: ./portal
    expose:
      - '8000'
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=2)",
        ]
      interval: 2s
      timeout: 3s
      retries: 15

networks:
  default:
    internal: true
