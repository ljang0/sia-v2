schema_version = "1.3"
artifacts = [{ source = "/workspace/answer.json", destination = "answer.json" }]

[task]
name = "sia/semester-instructors"
description = "Find the current instructors across course pages in a synthetic campus portal."
keywords = ["computer-use", "browser", "source-verification", "education"]

[metadata]
category = "computer-use"
difficulty = "medium"
source = "synthetic scenario derived from a Sia reliability failure pattern; no user data"

[agent]
timeout_sec = 600.0

[verifier]
timeout_sec = 60.0
environment_mode = "separate"

[environment]
build_timeout_sec = 1200.0
# Compose enforces an internal portal network on Docker hosts without Harbor's
# optional kernel egress-control support (including this macOS/Colima host).
cpus = 2
memory_mb = 4096
storage_mb = 4096

[verifier.environment]
# The verifier Compose service uses network_mode: none.
cpus = 1
memory_mb = 512
storage_mb = 1024
