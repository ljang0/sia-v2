name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Type, test, build, and Electron E2E
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.6.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Electron distribution
        run: pnpm --filter @sia/desktop exec install-electron

      - name: Build and run quality gates
        run: pnpm check

      - name: Run Electron E2E
        run: pnpm test:e2e

      - name: Upload Electron E2E failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: electron-e2e-failure-${{ github.run_attempt }}
          path: |
            apps/desktop/test-results
            apps/desktop/playwright-report
          if-no-files-found: warn
          retention-days: 7

      - name: Package and verify unsigned universal app
        run: pnpm package:mac:dir

  signed-release:
    name: Sign, notarize, staple, and verify release
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 60
    environment: alpha-release
    env:
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      SIA_RELEASE_API_BASE_URL: ${{ secrets.SIA_RELEASE_API_BASE_URL }}
      SIA_RELEASE_COGNITO_REGION: ${{ secrets.SIA_RELEASE_COGNITO_REGION }}
      SIA_RELEASE_COGNITO_CLIENT_ID: ${{ secrets.SIA_RELEASE_COGNITO_CLIENT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.6.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Electron distribution
        run: pnpm --filter @sia/desktop exec install-electron

      - name: Run release gates
        run: pnpm check && pnpm test:e2e

      - name: Build and verify signed release
        run: pnpm package:mac

      - name: Upload verified release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sia-alpha-macos
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
          if-no-files-found: error
