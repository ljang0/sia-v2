# Generate the Xcode project with `xcodegen` (see README.md). The .xcodeproj is not checked in.
name: Sia
options:
  bundleIdPrefix: ai.sia
  deploymentTarget:
    iOS: '17.0'
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: DXYJ578DD4
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 30
    SWIFT_VERSION: 5.0
targets:
  Sia:
    type: application
    platform: iOS
    sources:
      - path: Sia
      # The phone screens, built by `pnpm --filter @sia/desktop remote:build`.
      - path: ../desktop/out/remote
        type: folder
        buildPhase: resources
    preBuildScripts:
      - name: Require the built phone screens
        basedOnDependencyAnalysis: false
        script: |
          if [ ! -f "${SRCROOT}/../desktop/out/remote/index.html" ]; then
            echo "error: Run 'pnpm --filter @sia/desktop remote:build' before building the iPhone app."
            exit 1
          fi
    info:
      path: Sia/Info.plist
      properties:
        CFBundleDisplayName: Sia
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: Sia uses the camera only to scan the pairing code on your Mac.
        NSMicrophoneUsageDescription: Sia uses the microphone when you speak a request.
        NSSpeechRecognitionUsageDescription: Sia turns your spoken request into text.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.sia.phone
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: '1'
  SiaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SiaTests
    dependencies:
      - target: Sia
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
schemes:
  Sia:
    build:
      targets:
        Sia: all
        SiaTests: [test]
    test:
      targets:
        - SiaTests
